<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>Verlet Sandbox — Touch</title>

  <style>
    /* ------------------------------------------------------------------
       THEME — generated by theme-lab.html. To retheme, paste a new block
       over this one; every rule below is expressed in these tokens, and
       lengths are multiplied by --scale so one knob resizes the whole UI.
       ------------------------------------------------------------------ */
    :root {
      --scale: 1;
      --font: Menlo, Consolas, monospace;
      --font-size: 14px;
      --text: #ffffff;
      --muted: #ffffff;
      --accent: #e01b24;
      --page-bg: #000000;
      --canvas-bg: #000000;
      --radius: 0px;
      --btn-radius: 0px;
      --input-radius: 0px;
      --border-w: 0.5px;
      --border: #383838;
      --blur: 0px;
      --shadow-size: 0px;
      --shadow-alpha: 0;
      --bar-bg: #111111;
      --bar-alpha: 1;
      --bar-pad: 7px;
      --bar-gap: 8px;
      --bar-bottom: 10px;
      --btn-bg: #2a2a2a;
      --btn-border: #4a4a4a;
      --btn-text: #eeeeee;
      --btn-h: 24px;
      --btn-w: 24px;
      --btn-pad: 10px;
      --btn-font: 13px;
      --btn-weight: 100;
      --btn-on-bg: #540000;
      --btn-on-border: #000000;
      --btn-on-text: #ffffff;
      --panel-bg: #121212;
      --panel-alpha: 1;
      --panel-w: 340px;
      --panel-pad: 14px;
      --panel-line: #333333;
      --row-gap: 12px;
      --label: #aaaaaa;
      --group-size: 11px;
      --group-track: #2c2c2c;
      --hint: #777777;
      --track-h: 1px;
      --track-bg: #3a3a3a;
      --thumb: 15px;
      --thumb-col: #960000;
      --num-bg: #1a1a1a;
      --num-border: #444444;
      --num-w: 80px;
      --num-font: 13px;
      --stats-size: 12px;
      --stats-col: #c0bfbc;
      --particle: #ffffff;
      --particle-r: 4px;
      --stroke-col: #AC0000;
      --stroke-w: 6px;
      --eraser: #ff6666;
      --emitter: #2ec27e;
      --remover: #a51d2d;
    }

    /* ------------------------------------------------------------------
       Touch hygiene. Without these three, a drag on the canvas gets eaten
       by the browser — text selection, the magnifier loupe, rubber-band
       scrolling. See CLAUDE.md, "Touch front end".
       ------------------------------------------------------------------ */
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: var(--page-bg);
      color: var(--text);
      font: calc(var(--font-size) * var(--scale)) / 1.4 var(--font);
    }

    body {
      position: fixed;
      inset: 0;
    }

    #game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: var(--canvas-bg);
      touch-action: none;
    }

    /* ---------------------------------------------------------- toolbar */

    #bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--bar-bottom) * var(--scale) + env(safe-area-inset-bottom));
      display: flex;
      width: max-content;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(var(--bar-gap) * var(--scale));
      padding: calc(var(--bar-pad) * var(--scale));
      background: color-mix(in srgb, var(--bar-bg) calc(var(--bar-alpha) * 100%), transparent);
      -webkit-backdrop-filter: blur(calc(var(--blur) * var(--scale)));
      backdrop-filter: blur(calc(var(--blur) * var(--scale)));
      border: calc(var(--border-w) * var(--scale)) solid var(--border);
      border-radius: calc(var(--radius) * var(--scale));
      box-shadow: 0 calc(var(--shadow-size) * var(--scale) * 0.4)
                    calc(var(--shadow-size) * var(--scale)) rgba(0, 0, 0, var(--shadow-alpha));
      transition: opacity 0.18s ease;
      z-index: 10;
      max-width: calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right));
    }

    #bar button {
      flex: 0 1 auto;
      min-width: calc(var(--btn-w) * var(--scale));
      min-height: calc(var(--btn-h) * var(--scale));
      padding: 0 calc(var(--btn-pad) * var(--scale));
      background: var(--btn-bg);
      border: calc(var(--border-w) * var(--scale)) solid var(--btn-border);
      border-radius: calc(var(--btn-radius) * var(--scale));
      color: var(--btn-text);
      font: var(--btn-weight) calc(var(--btn-font) * var(--scale)) / 1 var(--font);
      touch-action: manipulation;
      cursor: pointer;
    }
    #bar button.active {
      background: var(--btn-on-bg);
      border-color: var(--btn-on-border);
      color: var(--btn-on-text);
    }
    #bar button:active { background: var(--btn-on-bg); }
    #bar #grip {
      flex: 0 0 auto;
      align-self: stretch;
      min-width: calc(var(--btn-h) * var(--scale) * 0.45);
      border-radius: calc(var(--btn-radius) * var(--scale));
      background:
        radial-gradient(circle, var(--btn-border) 40%, transparent 42%) 0 0 / 100% 33.33%;
      cursor: grab;
      touch-action: none;
    }
    #bar #grip:active { cursor: grabbing; }

    #bar .sep {
      width: max(1px, calc(var(--border-w) * var(--scale)));
      margin: calc(6px * var(--scale)) 2px;
      background: var(--border);
    }

    /* Narrow phones: the bar wraps, so tighten the buttons and turn the
       divider into the line break — modes on top, actions underneath. */
    @media (max-width: 460px) {
      #bar #grip {
      flex: 0 0 auto;
      align-self: stretch;
      min-width: calc(var(--btn-h) * var(--scale) * 0.45);
      border-radius: calc(var(--btn-radius) * var(--scale));
      background:
        radial-gradient(circle, var(--btn-border) 40%, transparent 42%) 0 0 / 100% 33.33%;
      cursor: grab;
      touch-action: none;
    }
    #bar #grip:active { cursor: grabbing; }

    #bar .sep {
        width: 100%;
        height: 0;
        margin: 0;
        background: none;
      }
      #bar button {
        min-width: calc(var(--btn-w) * var(--scale) * 0.9);
        padding: 0 calc(var(--btn-pad) * var(--scale) * 0.8);
        font-size: calc(var(--btn-font) * var(--scale) * 0.92);
      }
    }

    /* ------------------------------------------------------------ stats */

    #stats {
      position: fixed;
      top: calc(8px * var(--scale) + env(safe-area-inset-top));
      left: calc(10px * var(--scale) + env(safe-area-inset-left));
      color: var(--stats-col);
      font-variant-numeric: tabular-nums;
      font-size: calc(var(--stats-size) * var(--scale));
      z-index: 10;
      pointer-events: none;
    }

    /* ------------------------------------------------------- side panel */

    #panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(calc(var(--panel-w) * var(--scale)), 88vw);
      display: flex;
      flex-direction: column;
      background: color-mix(in srgb, var(--panel-bg) calc(var(--panel-alpha) * 100%), transparent);
      -webkit-backdrop-filter: blur(calc(var(--blur) * var(--scale)));
      backdrop-filter: blur(calc(var(--blur) * var(--scale)));
      border-left: calc(var(--border-w) * var(--scale)) solid var(--panel-line);
      box-shadow: calc(var(--shadow-size) * var(--scale) * -0.4) 0
                  calc(var(--shadow-size) * var(--scale)) rgba(0, 0, 0, var(--shadow-alpha));
      transform: translateX(101%);
      transition: transform 0.22s ease;
      z-index: 20;
    }
    #panel.open { transform: translateX(0); }

    #panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px * var(--scale) + env(safe-area-inset-top))
               calc(var(--panel-pad) * var(--scale))
               calc(12px * var(--scale));
      border-bottom: calc(var(--border-w) * var(--scale)) solid var(--panel-line);
      flex: none;
    }
    #panel-head strong { font-weight: 600; letter-spacing: 0.06em; }
    #close {
      min-width: calc(44px * var(--scale));
      min-height: calc(40px * var(--scale));
      background: var(--btn-bg);
      border: calc(var(--border-w) * var(--scale)) solid var(--btn-border);
      border-radius: calc(var(--btn-radius) * var(--scale));
      color: var(--btn-text);
      font: calc(17px * var(--scale)) / 1 var(--font);
      touch-action: manipulation;
    }

    #panel-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: calc(4px * var(--scale))
               calc(var(--panel-pad) * var(--scale))
               calc(24px * var(--scale) + env(safe-area-inset-bottom));
    }

    .row { margin-top: calc(var(--row-gap) * var(--scale)); }
    .row label { display: block; color: var(--label); margin-bottom: calc(4px * var(--scale)); }
    .row .inputs { display: flex; gap: calc(10px * var(--scale)); align-items: center; }

    /* Fat, easy-to-hit slider track and thumb — the default one is a
       2px-tall hairline that is miserable to grab with a fingertip. */
    .row input[type=range] {
      flex: 1;
      min-width: 0;
      height: calc(34px * var(--scale));
      margin: 0;
      accent-color: var(--accent);
      background: transparent;
      touch-action: pan-y;
      -webkit-appearance: none;
      appearance: none;
    }
    .row input[type=range]::-webkit-slider-runnable-track {
      height: calc(var(--track-h) * var(--scale));
      border-radius: calc(var(--track-h) * var(--scale) / 2);
      background: var(--track-bg);
    }
    .row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: calc(var(--thumb) * var(--scale));
      height: calc(var(--thumb) * var(--scale));
      margin-top: calc((var(--track-h) - var(--thumb)) * var(--scale) / 2);
      border-radius: 50%;
      background: var(--thumb-col);
      border: none;
    }
    .row input[type=range]::-moz-range-track {
      height: calc(var(--track-h) * var(--scale));
      border-radius: calc(var(--track-h) * var(--scale) / 2);
      background: var(--track-bg);
    }
    .row input[type=range]::-moz-range-thumb {
      width: calc(var(--thumb) * var(--scale));
      height: calc(var(--thumb) * var(--scale));
      border: none;
      border-radius: 50%;
      background: var(--thumb-col);
    }

    /* Below 16px, focusing a number field makes iOS zoom the whole page —
       --num-font is deliberately tunable, so that is a theme decision. */
    .row.toggle { display: flex; align-items: center; gap: calc(10px * var(--scale)); }
    .row.toggle label { margin: 0; }
    .row input[type=checkbox] {
      -webkit-appearance: none; appearance: none;
      width: calc(18px * var(--scale)); height: calc(18px * var(--scale));
      margin: 0; border-radius: 0; border: 1px solid var(--track-bg);
      background: transparent; display: grid; place-content: center;
      font: bold calc(13px * var(--scale))/1 sans-serif; color: #fff;
    }
    .row input[type=checkbox]:checked { background: var(--thumb-col); border-color: var(--thumb-col); }
    .row input[type=checkbox]:checked::after { content: "\2713"; }
    .row input[type=number] {
      width: calc(var(--num-w) * var(--scale));
      background: var(--num-bg);
      border: calc(var(--border-w) * var(--scale)) solid var(--num-border);
      border-radius: calc(var(--input-radius) * var(--scale));
      color: var(--text);
      padding: calc(7px * var(--scale)) calc(6px * var(--scale));
      font: calc(var(--num-font) * var(--scale)) / 1 var(--font);
      -webkit-user-select: text;
      user-select: text;
    }

    .group {
      margin-top: calc(20px * var(--scale));
      padding-top: calc(10px * var(--scale));
      border-top: calc(var(--border-w) * var(--scale)) solid var(--group-track);
      color: var(--accent);
      font-size: calc(var(--group-size) * var(--scale));
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .group:first-child { border-top: 0; margin-top: calc(10px * var(--scale)); }

    #panel .wide {
      display: block;
      width: 100%;
      min-height: calc(46px * var(--scale));
      margin-top: calc(var(--row-gap) * var(--scale));
      background: var(--btn-bg);
      border: calc(var(--border-w) * var(--scale)) solid var(--btn-border);
      border-radius: calc(var(--btn-radius) * var(--scale));
      color: var(--btn-text);
      font: calc(14px * var(--scale)) / 1 var(--font);
      touch-action: manipulation;
    }

    .hint {
      margin-top: calc(10px * var(--scale));
      color: var(--hint);
      font-size: calc(12px * var(--scale));
    }
  </style>
</head>

<body>

  <canvas id="game"></canvas>

  <div id="stats"><span id="count">0</span> pts &middot; <span id="fps">60</span> fps</div>

  <div id="bar">
    <div id="grip" title="Drag to move the toolbar"></div>
    <button id="m-emit">Emit</button>
    <button id="m-draw">Draw</button>
    <button id="m-erase">Erase</button>
    <button id="m-place">Place: Emitter</button>
    <div class="sep"></div>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="gear">&#9881;</button>
  </div>

  <div id="panel">
    <div id="panel-head">
      <strong>VERLET</strong>
      <button id="close">Done</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="verlet-mobile.js"></script>
</body>
</html>
